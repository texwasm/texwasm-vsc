name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
  release:
    name: Release & publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci && npm i -g @vscode/vsce

      - name: Extract release notes from CHANGELOG.md
        run: |
          VER="${{ github.ref_name }}"
          VER="${VER#v}"
          awk -v ver="$VER" '
            /^## \[/{if(s) exit; if(index($0,"["ver"]")) s=1; next}
            s
          ' CHANGELOG.md > release-notes.md

      - name: Build and package extension (without assets)
        run: npm run package

      - name: Publish to VS Code Marketplace
        env:
          TEXWASM_VSCE_TOKEN: ${{ secrets.TEXWASM_VSCE_TOKEN }}
        run: vsce publish -p "$TEXWASM_VSCE_TOKEN"

      - name: Download WASM assets
        run: |
          ASSET_BASE_URL="$(node -p "require('./src/cache/assetUrls.json').baseUrl")"
          mkdir -p assets/busytex assets/biber
          for f in busytex.js busytex.wasm texlive-basic.js texlive-basic.data texlive-extra.js texlive-extra.data; do
            curl -fL "$ASSET_BASE_URL/$f" -o "assets/busytex/$f"
          done
          for f in biber.js biber.wasm biber.data; do
            curl -fL "$ASSET_BASE_URL/$f" -o "assets/biber/$f"
          done

      - name: Package extension (with assets)
        run: |
          VER="$(node -p "require('./package.json').version")"
          grep -v '^assets/' .vscodeignore > .vscodeignore.tmp
          mv .vscodeignore.tmp .vscodeignore
          vsce package --out "texwasm-${VER}-with-assets.vsix"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run:
          gh release create "$GITHUB_REF_NAME" "texwasm-*.vsix" -F release-notes.md
